<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GlobeTrotter | My Trips</title>

    <link
        rel="stylesheet"
        href="index.css"
    >

    <style>

        /* =================================
           TRIPS PAGE
        ================================= */

        .trips-page {

            max-width: 1100px;

            margin: 60px auto;

            padding: 0 25px;

        }


        .trips-heading {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }


        .trips-heading h1 {

            margin: 0;

            font-size: 34px;

            color: #222;

        }


        .trips-heading p {

            margin-top: 8px;

            color: #777;

        }


        /* =================================
           TRIP SECTION
        ================================= */

        .trip-section {

            background: #ffffff;

            border: 1px solid #e5e5e5;

            border-radius: 20px;

            padding: 28px;

            margin-bottom: 25px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.06);

        }


        .trip-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 25px;

        }


        .trip-title {

            margin: 0;

            font-size: 27px;

            color: #222;

        }


        .trip-style {

            display: inline-block;

            margin-top: 8px;

            padding: 7px 14px;

            border-radius: 20px;

            background: #f0f4ff;

            color: #4263eb;

            font-size: 13px;

            font-weight: 600;

        }


        /* =================================
           TRIP INFORMATION
        ================================= */

        .trip-info-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 25px;

        }


        .trip-info {

            background: #f8f9fb;

            border-radius: 14px;

            padding: 18px;

            border: 1px solid #eeeeee;

        }


        .trip-info-label {

            display: block;

            font-size: 12px;

            color: #888;

            margin-bottom: 7px;

        }


        .trip-info-value {

            font-size: 16px;

            font-weight: 600;

            color: #222;

        }


        /* =================================
           INTERESTS
        ================================= */

        .trip-interests {

            background: #fafafa;

            border-radius: 14px;

            padding: 18px;

            margin-bottom: 20px;

        }


        .trip-interests h3 {

            margin: 0 0 8px;

            font-size: 17px;

        }


        .trip-interests p {

            margin: 0;

            color: #666;

            line-height: 1.6;

        }


        /* =================================
           ACTION BUTTONS
        ================================= */

        .trip-actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            padding-top: 20px;

            border-top: 1px solid #eeeeee;

        }


        .trip-action-btn {

            border: none;

            padding: 10px 18px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .view-btn {

            background: #eef3ff;

            color: #4263eb;

        }


        .view-btn:hover {

            background: #4263eb;

            color: white;

        }


        .edit-btn {

            background: #fff4e6;

            color: #e67700;

        }


        .edit-btn:hover {

            background: #e67700;

            color: white;

        }


        .delete-btn {

            background: #fff0f0;

            color: #d63031;

        }


        .delete-btn:hover {

            background: #d63031;

            color: white;

        }


        /* =================================
           ADD SECTION BUTTON
        ================================= */

        .add-section-container {

            text-align: center;

            margin-top: 35px;

            padding-bottom: 50px;

        }


        .add-section-btn {

            border: 2px dashed #bbb;

            background: #ffffff;

            color: #555;

            padding: 16px 30px;

            border-radius: 14px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s ease;

        }


        .add-section-btn:hover {

            border-color: #4263eb;

            color: #4263eb;

            background: #f7f9ff;

        }


        /* =================================
           EMPTY
        ================================= */

        .no-trip {

            text-align: center;

            padding: 70px 20px;

            background: #ffffff;

            border: 1px dashed #ccc;

            border-radius: 20px;

        }


        .no-trip-icon {

            font-size: 45px;

            margin-bottom: 15px;

        }


        .no-trip h2 {

            margin-bottom: 8px;

        }


        .no-trip p {

            color: #777;

            margin-bottom: 20px;

        }


        /* =================================
           MODAL
        ================================= */

        .trip-modal {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 1000;

            background:
                rgba(0, 0, 0, 0.55);

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .trip-modal.show {

            display: flex;

        }


        .modal-box {

            width: 100%;

            max-width: 550px;

            background: white;

            border-radius: 20px;

            padding: 30px;

            max-height: 90vh;

            overflow-y: auto;

        }


        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

        }


        .modal-header h2 {

            margin: 0;

        }


        .close-modal {

            border: none;

            background: transparent;

            font-size: 30px;

            cursor: pointer;

        }


        .modal-detail {

            background: #f8f9fb;

            border-radius: 12px;

            padding: 15px;

            margin-bottom: 12px;

        }


        .modal-detail strong {

            display: block;

            color: #777;

            font-size: 12px;

            margin-bottom: 5px;

        }


        .modal-detail span {

            color: #222;

            font-size: 16px;

        }


        /* =================================
           EDIT FORM
        ================================= */

        .edit-group {

            margin-bottom: 20px;

        }


        .edit-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #333;

        }


        .edit-group input {

            width: 100%;

            box-sizing: border-box;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

        }


        .save-edit-btn {

            width: 100%;

            border: none;

            background: #4263eb;

            color: white;

            padding: 14px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

        }


        .save-edit-btn:hover {

            background: #304fc4;

        }


        /* =================================
           RESPONSIVE
        ================================= */

        @media (max-width: 800px) {

            .trip-info-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 550px) {

            .trip-info-grid {

                grid-template-columns: 1fr;

            }


            .trip-actions {

                flex-direction: column;

            }


            .trip-action-btn {

                width: 100%;

            }


            .trips-heading h1 {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">

        Globe<span>Trotter</span>

        <span class="plane">
            ✈
        </span>

    </div>


    <div class="nav-links">

        <a href="index.html">
            Explore
        </a>

        <a
            href="trips.html"
            class="active"
        >
            My Trips
        </a>

        <a href="index.html#destinations">
            Destinations
        </a>

        <a href="index.html#itinerary">
            Itinerary
        </a>

    </div>


    <div class="user-section">

        <span>
            Siddhi
        </span>

        <div class="user-avatar">
            S
        </div>

    </div>

</nav>



<!-- ================= TRIPS ================= -->

<main class="trips-page">


    <div class="trips-heading">

        <div>

            <h1>
                My Trips
            </h1>

            <p>
                Your planned adventures in one place.
            </p>

        </div>

    </div>


    <div id="tripsContainer">
    </div>



    <!-- ADD ANOTHER TRIP -->

    <div class="add-section-container">

        <button
            class="add-section-btn"
            onclick="addAnotherTrip()"
        >

            + Add Another Section

        </button>

    </div>


</main>



<!-- =========================================
     VIEW MODAL
========================================= -->

<div
    id="viewModal"
    class="trip-modal"
>

    <div class="modal-box">


        <div class="modal-header">

            <h2>
                Trip Details
            </h2>


            <button
                class="close-modal"
                onclick="closeViewModal()"
            >

                ×

            </button>

        </div>


        <div class="modal-detail">

            <strong>
                Destination
            </strong>

            <span id="viewDestination">
            </span>

        </div>


        <div class="modal-detail">

            <strong>
                Trip Type
            </strong>

            <span id="viewTripType">
            </span>

        </div>


        <div class="modal-detail">

            <strong>
                Start Date
            </strong>

            <span id="viewStartDate">
            </span>

        </div>


        <div class="modal-detail">

            <strong>
                End Date
            </strong>

            <span id="viewEndDate">
            </span>

        </div>


        <div class="modal-detail">

            <strong>
                Duration
            </strong>

            <span id="viewDuration">
            </span>

        </div>


        <div class="modal-detail">

            <strong>
                Budget
            </strong>

            <span id="viewBudget">
            </span>

        </div>


        <div class="modal-detail">

            <strong>
                Your Plans
            </strong>

            <span id="viewInterests">
            </span>

        </div>


    </div>

</div>



<!-- =========================================
     EDIT MODAL
========================================= -->

<div
    id="editModal"
    class="trip-modal"
>

    <div class="modal-box">


        <div class="modal-header">

            <h2>
                Edit Trip
            </h2>


            <button
                class="close-modal"
                onclick="closeEditModal()"
            >

                ×

            </button>

        </div>


        <div class="edit-group">

            <label>
                Destination
            </label>

            <input
                type="text"
                id="editDestination"
                readonly
            >

        </div>


        <div class="edit-group">

            <label>
                Start Date
            </label>

            <input
                type="date"
                id="editStartDate"
            >

        </div>


        <div class="edit-group">

            <label>
                End Date
            </label>

            <input
                type="date"
                id="editEndDate"
            >

        </div>


        <button
            class="save-edit-btn"
            onclick="saveEditedTrip()"
        >

            Save Changes

        </button>


    </div>

</div>



<script>


/* =========================================
   STORAGE KEY
========================================= */

const TRIP_STORAGE_KEY =
    "globeTrotterTrip";



/* =========================================
   GET TRIPS
========================================= */

function getTrips() {

    const saved =
        localStorage.getItem(
            TRIP_STORAGE_KEY
        );


    if (!saved) {

        return [];

    }


    try {

        const data =
            JSON.parse(saved);


        /*
           If old data is one object,
           convert it into an array.
        */

        if (
            !Array.isArray(data)
        ) {

            return [data];

        }


        return data;

    }

    catch (error) {

        console.error(
            "Invalid trip data:",
            error
        );

        return [];

    }

}



/* =========================================
   SAVE TRIPS
========================================= */

function saveTrips(trips) {

    localStorage.setItem(
        TRIP_STORAGE_KEY,
        JSON.stringify(trips)
    );

}



/* =========================================
   LOAD TRIPS
========================================= */

function loadTrip() {

    const container =
        document.getElementById(
            "tripsContainer"
        );


    const trips =
        getTrips();


    /* =====================================
       NO TRIPS
    ===================================== */

    if (trips.length === 0) {

        container.innerHTML = `

            <div class="no-trip">

                <div class="no-trip-icon">
                    ✈️
                </div>

                <h2>
                    No trips yet
                </h2>

                <p>
                    Create your first trip
                    to see it here.
                </p>

                <button
                    class="add-section-btn"
                    onclick="addAnotherTrip()"
                >

                    + Create Trip

                </button>

            </div>

        `;

        return;

    }



    /* =====================================
       DISPLAY TRIPS
    ===================================== */

    container.innerHTML = "";


    trips.forEach(
        function(trip, index) {


            const start =
                formatDate(
                    trip.startDate
                );


            const end =
                formatDate(
                    trip.endDate
                );


            const days =
                calculateDays(
                    trip.startDate,
                    trip.endDate
                );


            const budget =
                Number(
                    trip.budget || 0
                ).toLocaleString(
                    "en-IN"
                );


            const interests =
                trip.interests &&
                trip.interests.trim()
                    ? trip.interests
                    : "Explore the destination and enjoy the local experience.";


            const tripType =
                trip.tripType ||
                trip.travelStyle ||
                "Standard Trip";


            const section =
                document.createElement(
                    "section"
                );


            section.className =
                "trip-section";


            section.innerHTML = `

                <div class="trip-top">

                    <div>

                        <h2 class="trip-title">

                            ${escapeHTML(
                                trip.destination
                            )}

                        </h2>


                        <span class="trip-style">

                            ${escapeHTML(
                                tripType
                            )}

                        </span>

                    </div>

                </div>



                <div class="trip-info-grid">


                    <div class="trip-info">

                        <span class="trip-info-label">
                            Date Range
                        </span>

                        <span class="trip-info-value">

                            ${start}
                            to
                            ${end}

                        </span>

                    </div>



                    <div class="trip-info">

                        <span class="trip-info-label">
                            Duration
                        </span>

                        <span class="trip-info-value">

                            ${days}

                            ${days === 1
                                ? "Day"
                                : "Days"
                            }

                        </span>

                    </div>



                    <div class="trip-info">

                        <span class="trip-info-label">
                            Budget
                        </span>

                        <span class="trip-info-value">

                            ₹${budget}

                        </span>

                    </div>



                    <div class="trip-info">

                        <span class="trip-info-label">
                            Trip Type
                        </span>

                        <span class="trip-info-value">

                            ${escapeHTML(
                                tripType
                            )}

                        </span>

                    </div>


                </div>



                <div class="trip-interests">

                    <h3>
                        Your Plans
                    </h3>

                    <p>

                        ${escapeHTML(
                            interests
                        )}

                    </p>

                </div>



                <!-- ACTION BUTTONS -->

                <div class="trip-actions">


                    <button
                        class="trip-action-btn view-btn"
                        onclick="viewTrip(${index})"
                    >

                        👁 View

                    </button>


                    <button
                        class="trip-action-btn edit-btn"
                        onclick="editTrip(${index})"
                    >

                        ✏ Edit

                    </button>


                    <button
                        class="trip-action-btn delete-btn"
                        onclick="deleteTrip(${index})"
                    >

                        🗑 Delete

                    </button>


                </div>

            `;


            container.appendChild(
                section
            );

        }
    );

}



/* =========================================
   VIEW TRIP
========================================= */

function viewTrip(index) {

    const trips =
        getTrips();


    const trip =
        trips[index];


    if (!trip) {

        alert(
            "Trip not found."
        );

        return;

    }


    const days =
        calculateDays(
            trip.startDate,
            trip.endDate
        );


    document.getElementById(
        "viewDestination"
    ).textContent =
        trip.destination || "-";


    document.getElementById(
        "viewTripType"
    ).textContent =
        trip.tripType ||
        trip.travelStyle ||
        "Standard Trip";


    document.getElementById(
        "viewStartDate"
    ).textContent =
        formatDate(
            trip.startDate
        );


    document.getElementById(
        "viewEndDate"
    ).textContent =
        formatDate(
            trip.endDate
        );


    document.getElementById(
        "viewDuration"
    ).textContent =
        days +
        (
            days === 1
                ? " Day"
                : " Days"
        );


    document.getElementById(
        "viewBudget"
    ).textContent =
        "₹" +
        Number(
            trip.budget || 0
        ).toLocaleString(
            "en-IN"
        );


    document.getElementById(
        "viewInterests"
    ).textContent =
        trip.interests ||
        "No interests added.";


    document.getElementById(
        "viewModal"
    ).classList.add(
        "show"
    );

}



/* =========================================
   CLOSE VIEW
========================================= */

function closeViewModal() {

    document.getElementById(
        "viewModal"
    ).classList.remove(
        "show"
    );

}



/* =========================================
   EDIT TRIP
========================================= */

let editingTripIndex = null;


function editTrip(index) {

    const trips =
        getTrips();


    const trip =
        trips[index];


    if (!trip) {

        alert(
            "Trip not found."
        );

        return;

    }


    editingTripIndex =
        index;


    document.getElementById(
        "editDestination"
    ).value =
        trip.destination || "";


    document.getElementById(
        "editStartDate"
    ).value =
        trip.startDate || "";


    document.getElementById(
        "editEndDate"
    ).value =
        trip.endDate || "";


    document.getElementById(
        "editModal"
    ).classList.add(
        "show"
    );

}



/* =========================================
   SAVE EDITED TRIP
========================================= */

function saveEditedTrip() {

    if (
        editingTripIndex === null
    ) {

        return;

    }


    const startDate =
        document.getElementById(
            "editStartDate"
        ).value;


    const endDate =
        document.getElementById(
            "editEndDate"
        ).value;


    /* =====================================
       VALIDATION
    ===================================== */

    if (!startDate) {

        alert(
            "Please select a start date."
        );

        return;

    }


    if (!endDate) {

        alert(
            "Please select an end date."
        );

        return;

    }


    if (
        new Date(endDate) <
        new Date(startDate)
    ) {

        alert(
            "End date cannot be before start date."
        );

        return;

    }


    /* =====================================
       GET TRIPS
    ===================================== */

    const trips =
        getTrips();


    const trip =
        trips[editingTripIndex];


    if (!trip) {

        alert(
            "Trip not found."
        );

        return;

    }


    /* =====================================
       UPDATE DATES
    ===================================== */

    trip.startDate =
        startDate;


    trip.endDate =
        endDate;


    /*
       Save the updated trip
    */

    saveTrips(trips);


    /* =====================================
       CLOSE MODAL
    ===================================== */

    closeEditModal();


    editingTripIndex =
        null;


    /* =====================================
       REFRESH DISPLAY
    ===================================== */

    loadTrip();


    alert(
        "Trip updated successfully!"
    );

}



/* =========================================
   CLOSE EDIT MODAL
========================================= */

function closeEditModal() {

    document.getElementById(
        "editModal"
    ).classList.remove(
        "show"
    );


    editingTripIndex =
        null;

}



/* =========================================
   DELETE TRIP
========================================= */

function deleteTrip(index) {

    const trips =
        getTrips();


    const trip =
        trips[index];


    if (!trip) {

        alert(
            "Trip not found."
        );

        return;

    }


    /* =====================================
       CONFIRM DELETE
    ===================================== */

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this trip?"
        );


    if (!confirmDelete) {

        return;

    }


    /* =====================================
       REMOVE TRIP
    ===================================== */

    trips.splice(
        index,
        1
    );


    /* =====================================
       SAVE UPDATED TRIPS
    ===================================== */

    saveTrips(
        trips
    );


    /* =====================================
       REFRESH PAGE
    ===================================== */

    loadTrip();

}



/* =========================================
   FORMAT DATE
========================================= */

function formatDate(
    dateString
) {

    if (!dateString) {

        return "Not specified";

    }


    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    );

}



/* =========================================
   CALCULATE DURATION
========================================= */

function calculateDays(
    startDate,
    endDate
) {

    if (
        !startDate ||
        !endDate
    ) {

        return 0;

    }


    const start =
        new Date(
            startDate +
            "T00:00:00"
        );


    const end =
        new Date(
            endDate +
            "T00:00:00"
        );


    const difference =
        end - start;


    return (
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        ) + 1
    );

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value || "";


    return div.innerHTML;

}



/* =========================================
   ADD ANOTHER TRIP
========================================= */

function addAnotherTrip() {

    window.location.href =
        "index.html";

}



/* =========================================
   CLOSE MODALS WHEN CLICKING OUTSIDE
========================================= */

window.addEventListener(
    "click",
    function(event) {

        const viewModal =
            document.getElementById(
                "viewModal"
            );


        const editModal =
            document.getElementById(
                "editModal"
            );


        if (
            event.target ===
            viewModal
        ) {

            closeViewModal();

        }


        if (
            event.target ===
            editModal
        ) {

            closeEditModal();

        }

    }
);



/* =========================================
   LOAD PAGE
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadTrip();

    }
);

</script>


</body>

</html>
