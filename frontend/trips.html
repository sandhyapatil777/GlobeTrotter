<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GlobeTrotter | My Trips</title>

    <link
        rel="stylesheet"
        href="index.css"
    >

    <style>

        /* =====================================================
           TRIPS PAGE
        ===================================================== */

        .trips-page {

            max-width: 1150px;

            margin: 60px auto;

            padding: 0 25px;

        }


        .trips-heading {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }


        .trips-heading h1 {

            margin: 0;

            font-size: 34px;

            color: #222;

        }


        .trips-heading p {

            margin-top: 8px;

            color: #777;

        }


        /* =====================================================
           TRIP CARD
        ===================================================== */

        .trip-section {

            background: #ffffff;

            border: 1px solid #e5e5e5;

            border-radius: 20px;

            padding: 28px;

            margin-bottom: 25px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.06);

        }


        .trip-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 25px;

        }


        .trip-title {

            margin: 0;

            font-size: 28px;

            color: #222;

        }


        .trip-style {

            display: inline-block;

            margin-top: 8px;

            padding: 7px 14px;

            border-radius: 20px;

            background: #f0f4ff;

            color: #4263eb;

            font-size: 13px;

            font-weight: 600;

        }


        /* =====================================================
           TRIP INFORMATION
        ===================================================== */

        .trip-info-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 25px;

        }


        .trip-info {

            background: #f8f9fb;

            border-radius: 14px;

            padding: 18px;

            border: 1px solid #eeeeee;

        }


        .trip-info-label {

            display: block;

            font-size: 12px;

            color: #888;

            margin-bottom: 7px;

        }


        .trip-info-value {

            font-size: 16px;

            font-weight: 600;

            color: #222;

        }


        /* =====================================================
           STOPS PREVIEW
        ===================================================== */

        .stops-preview {

            background: #fafafa;

            border-radius: 15px;

            padding: 20px;

            margin-bottom: 20px;

        }


        .stops-preview h3 {

            margin: 0 0 15px;

            font-size: 18px;

        }


        .stop-preview-item {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 12px;

            background: white;

            border: 1px solid #eeeeee;

            border-radius: 12px;

            margin-bottom: 10px;

        }


        .stop-number {

            width: 32px;

            height: 32px;

            min-width: 32px;

            border-radius: 50%;

            background: #4263eb;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: 700;

            font-size: 14px;

        }


        .stop-preview-info {

            flex: 1;

        }


        .stop-preview-city {

            font-weight: 700;

            color: #222;

        }


        .stop-preview-date {

            color: #777;

            font-size: 13px;

            margin-top: 3px;

        }


        .more-stops {

            text-align: center;

            color: #4263eb;

            font-size: 14px;

            font-weight: 600;

            margin-top: 8px;

        }


        /* =====================================================
           PLANS
        ===================================================== */

        .trip-interests {

            background: #fafafa;

            border-radius: 14px;

            padding: 18px;

            margin-bottom: 20px;

        }


        .trip-interests h3 {

            margin: 0 0 8px;

            font-size: 17px;

        }


        .trip-interests p {

            margin: 0;

            color: #666;

            line-height: 1.6;

        }


        /* =====================================================
           ACTION BUTTONS
        ===================================================== */

        .trip-actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            padding-top: 20px;

            border-top: 1px solid #eeeeee;

        }


        .trip-action-btn {

            border: none;

            padding: 11px 18px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .view-btn {

            background: #eef3ff;

            color: #4263eb;

        }


        .view-btn:hover {

            background: #4263eb;

            color: white;

        }


        .edit-btn {

            background: #fff4e6;

            color: #e67700;

        }


        .edit-btn:hover {

            background: #e67700;

            color: white;

        }


        .delete-btn {

            background: #fff0f0;

            color: #d63031;

        }


        .delete-btn:hover {

            background: #d63031;

            color: white;

        }


        /* =====================================================
           ADD TRIP
        ===================================================== */

        .add-section-container {

            text-align: center;

            margin-top: 35px;

            padding-bottom: 50px;

        }


        .add-section-btn {

            border: 2px dashed #bbb;

            background: #ffffff;

            color: #555;

            padding: 16px 30px;

            border-radius: 14px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s ease;

        }


        .add-section-btn:hover {

            border-color: #4263eb;

            color: #4263eb;

            background: #f7f9ff;

        }


        /* =====================================================
           EMPTY STATE
        ===================================================== */

        .no-trip {

            text-align: center;

            padding: 70px 20px;

            background: #ffffff;

            border: 1px dashed #ccc;

            border-radius: 20px;

        }


        .no-trip-icon {

            font-size: 45px;

            margin-bottom: 15px;

        }


        .no-trip h2 {

            margin-bottom: 8px;

        }


        .no-trip p {

            color: #777;

            margin-bottom: 20px;

        }


        /* =====================================================
           MODAL
        ===================================================== */

        .trip-modal {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 1000;

            background:
                rgba(0, 0, 0, 0.60);

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .trip-modal.show {

            display: flex;

        }


        .modal-box {

            width: 100%;

            max-width: 750px;

            background: white;

            border-radius: 20px;

            padding: 30px;

            max-height: 90vh;

            overflow-y: auto;

        }


        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

        }


        .modal-header h2 {

            margin: 0;

            font-size: 25px;

        }


        .close-modal {

            border: none;

            background: transparent;

            font-size: 30px;

            cursor: pointer;

            color: #555;

        }


        /* =====================================================
           MODAL DETAILS
        ===================================================== */

        .modal-detail {

            background: #f8f9fb;

            border-radius: 12px;

            padding: 15px;

            margin-bottom: 12px;

        }


        .modal-detail strong {

            display: block;

            color: #777;

            font-size: 12px;

            margin-bottom: 5px;

        }


        .modal-detail span {

            color: #222;

            font-size: 16px;

        }


        /* =====================================================
           FULL ITINERARY
        ===================================================== */

        .itinerary-title {

            margin-top: 30px;

            margin-bottom: 15px;

            font-size: 22px;

            color: #222;

        }


        .itinerary-stop {

            border: 1px solid #e5e5e5;

            border-radius: 16px;

            padding: 20px;

            margin-bottom: 15px;

            background: #ffffff;

        }


        .itinerary-stop-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 15px;

        }


        .itinerary-city {

            font-size: 20px;

            font-weight: 700;

            color: #222;

        }


        .itinerary-stop-number {

            display: inline-flex;

            width: 30px;

            height: 30px;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #4263eb;

            color: white;

            margin-right: 8px;

            font-size: 13px;

            font-weight: 700;

        }


        .itinerary-dates {

            color: #777;

            font-size: 14px;

        }


        .activities-title {

            font-size: 15px;

            font-weight: 700;

            margin-bottom: 10px;

        }


        .activity-list {

            margin: 0;

            padding-left: 20px;

        }


        .activity-list li {

            margin-bottom: 7px;

            color: #555;

        }


        .no-activities {

            color: #999;

            font-size: 14px;

        }


        /* =====================================================
           EDIT FORM
        ===================================================== */

        .edit-group {

            margin-bottom: 20px;

        }


        .edit-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #333;

        }


        .edit-group input {

            width: 100%;

            box-sizing: border-box;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

        }


        .save-edit-btn {

            width: 100%;

            border: none;

            background: #4263eb;

            color: white;

            padding: 14px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

        }


        .save-edit-btn:hover {

            background: #304fc4;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            .trip-info-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 550px) {

            .trip-info-grid {

                grid-template-columns: 1fr;

            }


            .trip-actions {

                flex-direction: column;

            }


            .trip-action-btn {

                width: 100%;

            }


            .trips-heading h1 {

                font-size: 27px;

            }


            .itinerary-stop-header {

                flex-direction: column;

                align-items: flex-start;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <div class="logo">

        Globe<span>Trotter</span>

        <span class="plane">

    </div>


    <div class="nav-links">

        </a>

    <div class="user-section">

<!-- =====================================================

<!-- =====================================================

>

<!-- =====================================================

<div

<script>

/* =====================================================
   GLOBETROTTER - TRIPS PAGE
   Complete Trip + Itinerary Handling
===================================================== */


/* =====================================================
   STORAGE KEYS
=====================================================

   The code checks both keys so it can work with
   your previous saved trips as well.

===================================================== */

const TRIP_STORAGE_KEY = "globeTrotterTrips";

const OLD_TRIP_STORAGE_KEY = "globeTrotterTrip";



/* =====================================================
   GET TRIPS
===================================================== */

function getTrips() {

    let saved =
        localStorage.getItem(
            TRIP_STORAGE_KEY
        );


    /*
       If the new storage key doesn't exist,
       check the old key.
    */

    if (!saved) {

        saved =
            localStorage.getItem(
                OLD_TRIP_STORAGE_KEY
            );

    }


    if (!saved) {

        return [];

    }


    try {

        const data =
            JSON.parse(saved);


        /*
           Old version stored one object.
           Convert it to an array.
        */

        if (!Array.isArray(data)) {

            return [data];

        }


        return data;

    }

    catch (error) {

        console.error(
            "Invalid trip data:",
            error
        );

        return [];

    }

}



/* =====================================================
   SAVE TRIPS
===================================================== */

function saveTrips(trips) {

    localStorage.setItem(

        TRIP_STORAGE_KEY,

        JSON.stringify(trips)

    );

}



/* =====================================================
   LOAD TRIPS
===================================================== */

function loadTrips() {

    const container =
        document.getElementById(
            "tripsContainer"
        );


    const trips =
        getTrips();


    /* =================================================
       NO TRIPS
    ================================================= */

    if (trips.length === 0) {

        container.innerHTML = `

            <div class="no-trip">

                <div class="no-trip-icon">
                    ✈️
                </div>

                <h2>
                    No trips yet
                </h2>

                <p>
                    Create your first trip
                    and build your itinerary.
                </p>

                <button
                    class="add-section-btn"
                    onclick="addAnotherTrip()"
                >

                    + Create Trip

                </button>

            </div>

        `;

        return;

    }



    /* =================================================
       DISPLAY TRIPS
    ================================================= */

    container.innerHTML = "";


    trips.forEach(
        function(trip, index) {

            const start =
                formatDate(
                    trip.startDate
                );


            const end =
                formatDate(
                    trip.endDate
                );


            const days =
                calculateDays(
                    trip.startDate,
                    trip.endDate
                );


            const budget =
                Number(
                    trip.budget || 0
                ).toLocaleString(
                    "en-IN"
                );


            const tripType =
                trip.tripType ||
                trip.travelStyle ||
                "Standard Trip";


            const destination =
                trip.destination ||
                "Unnamed Trip";


            const interests =
                trip.interests &&
                String(trip.interests).trim()

                    ? trip.interests

                    : "Explore the destination and enjoy the local experience.";


            /*
               Get stops.

               Supports:
               trip.stops
               trip.itinerary
            */

            const stops =
                getTripStops(trip);


            const section =
                document.createElement(
                    "section"
                );


            section.className =
                "trip-section";


            section.innerHTML = `

                <div class="trip-top">

                    <div>

                        <h2 class="trip-title">

                            ${escapeHTML(
                                destination
                            )}

                        </h2>


                        <span class="trip-style">

                            ${escapeHTML(
                                tripType
                            )}

                        </span>

                    </div>

                </div>


                <div class="trip-info-grid">


                    <div class="trip-info">

                        <span class="trip-info-label">
                            Date Range
                        </span>

                        <span class="trip-info-value">

                            ${start}

                            to

                            ${end}

                        </span>

                    </div>


                    <div class="trip-info">

                        <span class="trip-info-label">
                            Duration
                        </span>

                        <span class="trip-info-value">

                            ${days}

                            ${days === 1
                                ? "Day"
                                : "Days"
                            }

                        </span>

                    </div>


                    <div class="trip-info">

                        <span class="trip-info-label">
                            Budget
                        </span>

                        <span class="trip-info-value">

                            ₹${budget}

                        </span>

                    </div>


                    <div class="trip-info">

                        <span class="trip-info-label">
                            Stops
                        </span>

                        <span class="trip-info-value">

                            ${stops.length}

                            ${stops.length === 1
                                ? " City"
                                : " Cities"
                            }

                        </span>

                    </div>


                </div>


                <!-- STOPS PREVIEW -->

                ${
                    stops.length > 0

                    ? `

                        <div class="stops-preview">

                            <h3>
                                🗺️ Itinerary
                            </h3>

                            ${renderStopsPreview(
                                stops
                            )}

                        </div>

                    `

                    : ""

                }


                <!-- INTERESTS -->

                <div class="trip-interests">

                    <h3>
                        Your Plans
                    </h3>

                    <p>

                        ${escapeHTML(
                            interests
                        )}

                    </p>

                </div>


                <!-- ACTION BUTTONS -->

                <div class="trip-actions">


                    <button
                        class="trip-action-btn view-btn"
                        onclick="viewTrip(${index})"
                    >

                        👁 View Full Itinerary

                    </button>


                    <button
                        class="trip-action-btn edit-btn"
                        onclick="editTrip(${index})"
                    >

                        ✏ Edit

                    </button>


                    <button
                        class="trip-action-btn delete-btn"
                        onclick="deleteTrip(${index})"
                    >

                        🗑 Delete

                    </button>


                </div>

            `;


            container.appendChild(
                section
            );

        }
    );

}



/* =====================================================
   GET STOPS
===================================================== */

function getTripStops(trip) {

    if (
        Array.isArray(trip.stops)
    ) {

        return trip.stops;

    }


    if (
        Array.isArray(trip.itinerary)
    ) {

        return trip.itinerary;

    }


    return [];

}



/* =====================================================
   RENDER STOPS PREVIEW
===================================================== */

function renderStopsPreview(stops) {

    const maxStops = 4;


    let html = "";


    stops
        .slice(0, maxStops)
        .forEach(
            function(stop, index) {

                const city =
                    stop.city ||
                    stop.destination ||
                    stop.name ||
                    "Unknown City";


                const startDate =
                    stop.startDate ||
                    stop.fromDate ||
                    "";


                const endDate =
                    stop.endDate ||
                    stop.toDate ||
                    "";


                let dateText =
                    "Dates not specified";


                if (
                    startDate &&
                    endDate
                ) {

                    dateText =
                        formatDate(
                            startDate
                        )
                        +
                        " - "
                        +
                        formatDate(
                            endDate
                        );

                }

                else if (startDate) {

                    dateText =
                        formatDate(
                            startDate
                        );

                }


                html += `

                    <div class="stop-preview-item">

                        <div class="stop-number">

                            ${index + 1}

                        </div>


                        <div class="stop-preview-info">

                            <div class="stop-preview-city">

                                ${escapeHTML(
                                    city
                                )}

                            </div>


                            <div class="stop-preview-date">

                                ${escapeHTML(
                                    dateText
                                )}

                            </div>

                        </div>

                    </div>

                `;

            }
        );


    if (
        stops.length > maxStops
    ) {

        html += `

            <div class="more-stops">

                + ${stops.length - maxStops}
                more stop(s)

            </div>

        `;

    }


    return html;

}



/* =====================================================
   VIEW FULL TRIP
===================================================== */

function viewTrip(index) {

    const trips =
        getTrips();


    const trip =
        trips[index];


    if (!trip) {

        alert(
            "Trip not found."
        );

        return;

    }


    const days =
        calculateDays(
            trip.startDate,
            trip.endDate
        );


    const tripType =
        trip.tripType ||
        trip.travelStyle ||
        "Standard Trip";


    document.getElementById(
        "viewDestination"
    ).textContent =
        trip.destination ||
        "Not specified";


    document.getElementById(
        "viewTripType"
    ).textContent =
        tripType;


    document.getElementById(
        "viewDates"
    ).textContent =

        formatDate(
            trip.startDate
        )

        +

        " to "

        +

        formatDate(
            trip.endDate
        );


    document.getElementById(
        "viewDuration"
    ).textContent =

        days
        +
        (
            days === 1
                ? " Day"
                : " Days"
        );


    document.getElementById(
        "viewBudget"
    ).textContent =

        "₹"
        +
        Number(
            trip.budget || 0
        ).toLocaleString(
            "en-IN"
        );


    document.getElementById(
        "viewInterests"
    ).textContent =

        trip.interests ||

        "No interests added.";



    /* =================================================
       FULL ITINERARY
    ================================================= */

    const stops =
        getTripStops(trip);


    const itineraryContainer =
        document.getElementById(
            "fullItinerary"
        );


    if (
        stops.length === 0
    ) {

        itineraryContainer.innerHTML = `

            <div class="modal-detail">

                <strong>
                    Itinerary
                </strong>

                <span>
                    No stops have been added yet.
                </span>

            </div>

        `;

    }

    else {

        itineraryContainer.innerHTML =
            renderFullItinerary(
                stops
            );

    }


    document.getElementById(
        "viewModal"
    ).classList.add(
        "show"
    );

}



/* =====================================================
   RENDER COMPLETE ITINERARY
===================================================== */

function renderFullItinerary(stops) {

    let html = "";


    stops.forEach(
        function(stop, index) {

            const city =
                stop.city ||
                stop.destination ||
                stop.name ||
                "Unknown City";


            const startDate =
                stop.startDate ||
                stop.fromDate ||
                "";


            const endDate =
                stop.endDate ||
                stop.toDate ||
                "";


            let dateText =
                "Dates not specified";


            if (
                startDate &&
                endDate
            ) {

                dateText =

                    formatDate(
                        startDate
                    )

                    +

                    " - "

                    +

                    formatDate(
                        endDate
                    );

            }

            else if (startDate) {

                dateText =
                    formatDate(
                        startDate
                    );

            }


            /*
               Activities can be stored as:

               activities: []

               OR

               activity: "..."

               OR

               plans: []
            */

            let activities = [];


            if (
                Array.isArray(
                    stop.activities
                )
            ) {

                activities =
                    stop.activities;

            }

            else if (
                Array.isArray(
                    stop.plans
                )
            ) {

                activities =
                    stop.plans;

            }

            else if (
                stop.activity
            ) {

                activities = [
                    stop.activity
                ];

            }


            html += `

                <div class="itinerary-stop">


                    <div class="itinerary-stop-header">

                        <div>

                            <span class="itinerary-stop-number">

                                ${index + 1}

                            </span>


                            <span class="itinerary-city">

                                ${escapeHTML(
                                    city
                                )}

                            </span>

                        </div>


                        <div class="itinerary-dates">

                            📅 ${escapeHTML(
                                dateText
                            )}

                        </div>

                    </div>


                    <div>

                        <div class="activities-title">

                            🎯 Activities

                        </div>


                        ${
                            activities.length > 0

                            ?

                            `

                                <ul class="activity-list">

                                    ${activities
                                        .map(
                                            function(activity) {

                                                return `

                                                    <li>

                                                        ${escapeHTML(
                                                            typeof activity === "object"

                                                                ? (
                                                                    activity.name ||
                                                                    activity.title ||
                                                                    JSON.stringify(activity)
                                                                )

                                                                : activity
                                                        )}

                                                    </li>

                                                `;

                                            }
                                        )
                                        .join("")
                                    }

                                </ul>

                            `

                            :

                            `

                                <div class="no-activities">

                                    No activities added
                                    for this stop.

                                </div>

                            `

                        }

                    </div>


                </div>

            `;

        }
    );


    return html;

}



/* =====================================================
   CLOSE VIEW MODAL
===================================================== */

function closeViewModal() {

    document.getElementById(
        "viewModal"
    ).classList.remove(
        "show"
    );

}



/* =====================================================
   EDIT TRIP
===================================================== */

let editingTripIndex = null;


function editTrip(index) {

    const trips =
        getTrips();


    const trip =
        trips[index];


    if (!trip) {

        alert(
            "Trip not found."
        );

        return;

    }


    editingTripIndex =
        index;


    document.getElementById(
        "editDestination"
    ).value =

        trip.destination ||
        "";


    document.getElementById(
        "editStartDate"
    ).value =

        trip.startDate ||
        "";


    document.getElementById(
        "editEndDate"
    ).value =

        trip.endDate ||
        "";


    document.getElementById(
        "editModal"
    ).classList.add(
        "show"
    );

}



/* =====================================================
   SAVE EDITED TRIP
===================================================== */

function saveEditedTrip() {

    if (
        editingTripIndex === null
    ) {

        return;

    }


    const startDate =
        document.getElementById(
            "editStartDate"
        ).value;


    const endDate =
        document.getElementById(
            "editEndDate"
        ).value;


    if (!startDate) {

        alert(
            "Please select a start date."
        );

        return;

    }


    if (!endDate) {

        alert(
            "Please select an end date."
        );

        return;

    }


    if (
        new Date(endDate)
        <
        new Date(startDate)
    ) {

        alert(
            "End date cannot be before start date."
        );

        return;

    }


    const trips =
        getTrips();


    const trip =
        trips[editingTripIndex];


    if (!trip) {

        alert(
            "Trip not found."
        );

        return;

    }


    trip.startDate =
        startDate;


    trip.endDate =
        endDate;


    /*
       IMPORTANT:

       We don't delete the stops.

       The itinerary stays saved.
    */


    saveTrips(
        trips
    );


    closeEditModal();


    editingTripIndex =
        null;


    loadTrips();


    alert(
        "Trip updated successfully!"
    );

}



/* =====================================================
   CLOSE EDIT MODAL
===================================================== */

function closeEditModal() {

    document.getElementById(
        "editModal"
    ).classList.remove(
        "show"
    );


    editingTripIndex =
        null;

}



/* =====================================================
   DELETE TRIP
===================================================== */

function deleteTrip(index) {

    const trips =
        getTrips();


    const trip =
        trips[index];


    if (!trip) {

        alert(
            "Trip not found."
        );

        return;

    }


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this entire trip and its itinerary?"
        );


    if (!confirmDelete) {

        return;

    }


    trips.splice(
        index,
        1
    );


    saveTrips(
        trips
    );


    loadTrips();

}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(dateString) {

    if (!dateString) {

        return "Not specified";

    }


    /*
       If date is already formatted text,
       don't attempt to parse it.
    */

    if (
        typeof dateString !== "string"
        ||
        !/^\d{4}-\d{2}-\d{2}$/.test(
            dateString
        )
    ) {

        return String(
            dateString
        );

    }


    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    );

}



/* =====================================================
   CALCULATE DAYS
===================================================== */

function calculateDays(
    startDate,
    endDate
) {

    if (
        !startDate ||
        !endDate
    ) {

        return 0;

    }


    const start =
        new Date(
            startDate +
            "T00:00:00"
        );


    const end =
        new Date(
            endDate +
            "T00:00:00"
        );


    const difference =
        end - start;


    return (

        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        )

        +

        1

    );

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value === undefined ||
        value === null

            ? ""

            : String(value);


    return div.innerHTML;

}

    }
);
